<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word 图文排版工具</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo">W</div>
      <div>
        <h1>Word 图文排版工具</h1>
        <p class="subtitle">自动等比缩放图片 · 页尾留白控制 · 同组图片等尺寸 · 图注居中</p>
      </div>
    </div>
    <div class="actions">
      <button id="btn-sample" class="btn btn-ghost">载入示例</button>
      <button id="btn-export" class="btn btn-primary" disabled>导出排版后文档</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧：配置与上传 -->
    <aside class="panel panel-left">
      <section class="card">
        <h2>1. 上传 Word 文档</h2>
        <div id="drop-zone" class="drop-zone">
          <input type="file" id="file-input" accept=".docx" hidden>
          <div class="drop-inner">
            <svg viewBox="0 0 24 24" width="40" height="40"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
            <p><strong>点击或拖拽</strong> .docx 文件至此</p>
            <p class="hint">仅支持嵌入式图片，不支持浮动图片</p>
          </div>
        </div>
        <div id="file-info" class="file-info hidden"></div>
      </section>

      <section class="card">
        <h2>2. 页面与边距</h2>
        <div class="form-grid">
          <label>纸张
            <select id="cfg-paper">
              <option value="A4" selected>A4 (210×297mm)</option>
              <option value="A3">A3 (297×420mm)</option>
              <option value="Letter">Letter (216×279mm)</option>
            </select>
          </label>
          <label>正文字号 (pt)
            <input type="number" id="cfg-fontsize" value="10.5" step="0.5" min="6" max="24">
          </label>
          <label>行距倍数
            <input type="number" id="cfg-linespacing" value="1.5" step="0.1" min="1" max="3">
          </label>
          <label>上边距 (mm)
            <input type="number" id="cfg-margin-top" value="25.4" step="0.5">
          </label>
          <label>下边距 (mm)
            <input type="number" id="cfg-margin-bottom" value="25.4" step="0.5">
          </label>
          <label>左边距 (mm)
            <input type="number" id="cfg-margin-left" value="31.7" step="0.5">
          </label>
          <label>右边距 (mm)
            <input type="number" id="cfg-margin-right" value="31.7" step="0.5">
          </label>
        </div>
      </section>

      <section class="card">
        <h2>3. 排版规则</h2>
        <div class="form-grid">
          <label>页尾最大留白 (行)
            <input type="number" id="cfg-tail-lines" value="4" step="1" min="1" max="10">
          </label>
          <label>最小图片宽度 (版心%)
            <input type="number" id="cfg-min-width" value="30" step="5" min="10" max="100">
          </label>
          <label>最大图片宽度 (版心%)
            <input type="number" id="cfg-max-width" value="100" step="5" min="30" max="100">
          </label>
          <label>图注下方段间距 (pt)
            <input type="number" id="cfg-caption-after" value="9" step="1" min="0" max="36">
          </label>
          <label class="checkbox">
            <input type="checkbox" id="cfg-center-caption" checked> 图注居中
          </label>
          <label class="checkbox">
            <input type="checkbox" id="cfg-equal-group" checked> 同组图片等尺寸
          </label>
        </div>
      </section>

      <section class="card">
        <h2>4. 同组识别策略</h2>
        <div class="form-grid">
          <label class="checkbox">
            <input type="checkbox" id="cfg-detect-number" checked> 编号规律 (图 3-1, 3-2…)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="cfg-detect-keyword" checked> 关键词 (云图/温度/速度场…)
          </label>
          <label class="checkbox">
            <input type="checkbox" id="cfg-detect-similarity" checked> 图注语义相似度
          </label>
          <label class="checkbox">
            <input type="checkbox" id="cfg-detect-ratio" checked> 宽高比相近 (±5%)
          </label>
          <label>相似度阈值
            <input type="number" id="cfg-sim-threshold" value="0.6" step="0.05" min="0.1" max="1">
          </label>
        </div>
        <button id="btn-relayout" class="btn btn-secondary" disabled>重新计算排版</button>
      </section>
    </aside>

    <!-- 中间：预览区 -->
    <section class="panel panel-center">
      <div class="toolbar">
        <h2>页面预览</h2>
        <div class="zoom-controls">
          <button class="btn-icon" id="zoom-out">−</button>
          <span id="zoom-label">75%</span>
          <button class="btn-icon" id="zoom-in">+</button>
          <span class="separator">|</span>
          <span id="page-stats" class="muted">尚未载入文档</span>
        </div>
      </div>
      <div id="preview-container" class="preview-container">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" width="80" height="80"><path fill="currentColor" opacity=".3" d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/></svg>
          <p>载入 Word 文档后将在此显示排版预览</p>
          <button id="btn-load-sample" class="btn btn-primary">使用示例文档</button>
        </div>
      </div>
    </section>

    <!-- 右侧：图片分组与日志 -->
    <aside class="panel panel-right">
      <section class="card">
        <h2>图片分组</h2>
        <div id="groups-list" class="groups-list">
          <p class="muted small">载入文档后显示自动识别的分组结果</p>
        </div>
      </section>

      <section class="card">
        <h2>处理日志</h2>
        <div id="log-area" class="log-area">
          <p class="muted small">等待操作…</p>
        </div>
      </section>
    </aside>
  </main>

  <footer class="app-footer">
    <span>规则：页尾留白 ≤ 4 行 · 同组等尺寸 · 图注居中 · 等比缩放 · 最小 30% 版心宽</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
